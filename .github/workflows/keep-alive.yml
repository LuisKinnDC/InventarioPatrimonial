name: Supabase Keep-Alive

# Evita que el proyecto Supabase (plan gratuito) se suspenda por 7 días de
# inactividad. Hace una lectura mínima cada lunes a la medianoche (UTC).
# Configurar los secrets del repo: SUPABASE_URL y SUPABASE_ANON_KEY.

on:
  schedule:
    - cron: '0 0 * * 1' # Lunes 00:00 UTC
  workflow_dispatch: {} # permite ejecutarlo manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase (lectura mínima)
        run: |
          curl -sf \
            "${{ secrets.SUPABASE_URL }}/rest/v1/niveles_educativos?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            && echo "Keep-alive OK" \
            || (echo "Keep-alive FALLÓ" && exit 1)
